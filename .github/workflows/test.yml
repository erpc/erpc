name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  units:
    runs-on: "${{ github.repository_owner == 'erpc' && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-24.04' }}"
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: make setup
      - name: Build
        run: make build
      - name: Test with the Go CLI
        run: make test-fast COVER_DIR=${{ runner.temp }}/coverage
      - name: Merge coverage profiles
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/coverage"
          # Every shard profiles all packages, so blocks repeat across files:
          # keep one row per block, summing its hit counts.
          awk 'FNR==1 {next} {split($0, f, " "); k=f[1] " " f[2]; n[k]+=f[3]} END {print "mode: atomic"; for (k in n) print k, n[k]}' "$DIR"/*.out > "$DIR/coverage.txt"
          TOTAL=$(go tool cover -func="$DIR/coverage.txt" | awk '/^total:/ {print $NF}')
          echo "Total coverage: $TOTAL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage/coverage.txt
          disable_search: true
          fail_ci_if_error: false # a Codecov outage must not turn main red

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
      - name: Run Gosec Security Scanner
        uses: securego/gosec@5e72efc19d97e11549b3427b83fab3257a8c9894 # master
        with:
          args: -exclude=G115 -exclude-dir=test -tests=false ./...
