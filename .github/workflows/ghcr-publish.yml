# Build and push ghcr.io/linkpoolio/erpc:<tag> from an arbitrary git ref.
# Uses GITHUB_TOKEN (packages:write) — same pattern as docker-images / release.yml.
#
# Run: Actions → "Publish to GHCR" → workflow_dispatch
#   tag: pin-near-tip-getblock-test9
#   ref: feat/websocket-support

name: Publish to GHCR

concurrency:
  group: ghcr-publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. pin-near-tip-getblock-test9)"
        required: true
        type: string
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: true
        default: "feat/websocket-support"
        type: string
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set build metadata
        id: meta
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          REPO="${GITHUB_REPOSITORY,,}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "Building ref=${{ inputs.ref }} sha=${SHORT} → ghcr.io/${REPO}:${{ inputs.tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.tag }}
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
          provenance: false
          sbom: false

      - name: Print digest
        run: |
          docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ inputs.tag }}"
