# Redis-backed EVM head cache with WebSocket subscriptions.
# Set REDIS_URL and RPC_URL before starting eRPC.

server:
  webSocket:
    enabled: true

database:
  evmJsonRpcCache:
    connectors:
      - id: redis-cache
        driver: redis
        redis:
          uri: ${REDIS_URL}

projects:
  - id: main
    networks:
      - architecture: evm
        evm:
          chainId: 1
          blockStore:
            enabled: true
            connectorId: redis-cache
            # The verified window is prefetched gradually when first started.
    upstreams:
      - id: evm-upstream
        endpoint: ${RPC_URL}
        evm:
          chainId: 1
