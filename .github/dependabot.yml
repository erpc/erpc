version: 2

multi-ecosystem-groups:
  all-updates:
    schedule:
      interval: "weekly"
    reviewers:
      - "kasrakhosravi"
      - "aramalipoor"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "docker"
    directory: "/docs"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "docker"
    directory: "/monitoring"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "gomod"
    directory: "/"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Removed Unary/StreamServerInterceptor in v0.61/v0.62, which
      # envoyproxy/ratelimit/src/server still calls. Unpin go.mod together with this.
      - dependency-name: "go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc"
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "npm"
    directory: "/docs"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "npm"
    directory: "/test/util"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "npm"
    directory: "/typescript/cli"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"

  - package-ecosystem: "npm"
    directory: "/typescript/config"
    patterns:
      - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "all-updates"
