# Venn-parity example: an indexer-facing eRPC fleet with several replicas.
#
# Two required components:
#   - evm.headCache: a token-fenced Redis lease selects one refresher per trust,
#     namespace, project and network scope. It publishes a canonical snapshot;
#     followers validate the snapshot and immutable block/log payloads.
#   - server.webSocket: eth_subscribe newHeads/logs fed by the shared head cache.
#     Only eth_subscribe / eth_unsubscribe are accepted over WS.
# Head-cache polling/hydration is centralized while Redis is healthy. Independent
# EVM state pollers/probes and ordinary HTTP misses can still call upstream per
# replica. This example does not claim zero fleet-wide provider calls.
# Validated by the Go config loader (common/venn_parity_example_test.go).
#
# Environment variables (expanded by the loader):
#   REDIS_URL           redis://host:6379/0 used by the cache and shared head-cache state
#   RPC_URL             EVM upstream endpoint

logLevel: info

server:
  httpHostV4: 0.0.0.0
  httpPort: 4000
  webSocket:
    enabled: true
    # Per process, not per fleet. Put a per-client connection limit in front.
    maxConnections: 1024
    maxSubscriptionsPerConnection: 32
    # A client that falls this far behind is disconnected (1008), never buffered unbounded.
    sendQueueSize: 256

metrics:
  enabled: true
  hostV4: 0.0.0.0
  port: 4001

database:
  evmJsonRpcCache:
    connectors:
      # Also referenced by evm.headCache.connectorId for payloads, leases and snapshots.
      - id: redis-cache
        driver: redis
        redis:
          uri: ${REDIS_URL}
    policies:
      - connector: redis-cache
        network: "*"
        method: "*"
        finality: finalized
        ttl: 0

projects:
  - id: main
    networks:
      - architecture: evm
        evm:
          chainId: 1
          headCache:
            enabled: true
            # Must name a redis connector in database.evmJsonRpcCache.connectors.
            connectorId: redis-cache
            # The lease holder verifies the shared canonical head; followers use its snapshot.
            depth: 128
            maxBytes: 268435456

    upstreams:
      - id: evm-upstream
        endpoint: ${RPC_URL}
        evm:
          chainId: 1
